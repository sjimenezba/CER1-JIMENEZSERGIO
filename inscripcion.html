<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscripcion - Centro Cultural Puerto Abierto</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Oswald:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/bootstrap.css">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="icon" type="image/x-icon" href="img/favicon.ico">
</head>
<body>
    <header>
        <a href="index.html">
            <img src="img/logo-horizontal.png" alt="Logo de Centro Cultural Puerto Abierto" width="300">
        </a>
        <nav class="navbar navbar-expand-lg" style="background-color: #cb5e31;">
            <div class="container-fluid">
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                    <a class="nav-link text-light" aria-current="page" href="index.html" >Home</a>
                    </li>
                    <li class="nav-item">
                    <a class="nav-link text-light" aria-current="page" href="cartelera.html">Cartelera</a>
                    </li>
                    <li class="nav-item">
                    <a class="nav-link active text-light" aria-current="page" href="#">Inscripcion</a>
                    </li>
                </ul>
                </div>
            </div>
            </nav>
    </header>
    <main>
        <section class="container mt-5">
            <div class="row justify-content-center">
                <div class="col-md-6">
                    <div class="card p-4 mb-5">
                        <h1 class="text-center">Inscripcion a Actividades</h1>
                        <p class="text-center mb-4">Completa el siguiente formulario para participar en uno de nuestros talleres</p>
                        <!-- FORMULARIO INSCRIPCION -->
                        <form action="#">
                            <!-- Nombre -->
                            <div class="mb-3">
                                <label for="nombre" class="form-label">Nombre Completo</label>
                                <input type="text" class="form-control" id="nombre" required>
                            </div>
                            <div class="row mb-3">
                                <!-- Correo -->
                                <div class="col-md-6 mb-3 mb-md-0">
                                    <label for="correo" class="form-label">Correo</label>
                                    <input type="email" class="form-control" id="correo" required>
                                </div>
                                <!-- Telefono -->
                                <div class="col-md-6">
                                    <label for="telefono" class="form-label">Telefono</label>
                                    <input type="tel" class="form-control" id="telefono" required>
                                </div>
                            </div>
                            <!-- Actividad -->
                            <div class="mb-3">
                                <label for="actividad" class="form-label">Actividad de Interes</label>
                                <select class="form-select" id="actividad" required>
                                    <option value="">Selecciona una opcion...</option>
                                    <option value="pintura">Taller de Pintura</option>
                                    <option value="cueca">Taller de Cueca</option>
                                    <option value="volantin">Taller de Volantin</option>
                                    <option value="cocina">Taller de Cocina Chilena</option>
                                    <option value="trompo">Taller de Trompo</option>
                                    <option value="guitarra">Taller de Musica Chilena</option>
                                </select>
                            </div>
                            <!-- Edad -->
                            <div class="mb-3">
                                <label for="edad" class="form-label">Edad</label>
                                <input type="number" class="form-control" id="edad" min="12" required>
                            </div>
                            <!-- Comentarios -->
                            <div class="mb-3">
                                <label for="comentarios" class="form-label">Comentarios (Opcional)</label>
                                <textarea class="form-control" id="comentarios" rows="3"></textarea>
                            </div>
                            <!-- Terminos y Condiciones -->
                            <div class="mb-3 form-check">
                                <input type="checkbox" class="form-check-input" id="condiciones" required>
                                <label for="condiciones" class="form-check-label">Acepto los terminos y condiciones de participacion</label>
                            </div>
                                
                            <!-- Boton de Submit-->
                            <button type="submit" class="btn btn-primary">Enviar Inscripcion</button>
                        </form>
                    </div>
                </div>
            </div>
        </section>
    </main>
    <footer class="text-end py-4 mt-auto border-top" style="background-color: #cb5e31;">
        <div class="container px-4 text-light">
            <div class="row align-items-center">
                <div class="col-md-6 text-center text-md-start mb-3 mb-md-0">
                    <img src="img/logo-horizontal-blanco.png" alt="Logo Centro Cultural Puerto Abierto" width="400">
                </div>
                <div class="col-md-6 text-center text-md-end">
                    <h4>Contacto y Ubicacion</h4>
                    <p>📍 Direccion: Avenida Puerto 123, Valparaiso</p>
                    <p>✉️ Correo Electronico: contacto@puertoabierto.cl</p>
                    <p>2026 Centro Cultural Puerto Abierto</p>
                </div>
            </div>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>
</body>
</html>
